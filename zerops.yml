zerops:
  - setup: api
    build:
      base: python@3.11
      buildCommands:
        - cd backend && pip install --no-cache-dir -r requirements.txt
      deployFiles:
        - backend/~
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        POSTGRES_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        NEO4J_URI: ${NEO4J_URI}
        NEO4J_USER: ${NEO4J_USER}
        NEO4J_PASSWORD: ${NEO4J_PASSWORD}
        GROQ_API_KEY: ${GROQ_API_KEY}
        GROQ_MODEL: ${GROQ_MODEL}
        STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
        STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
        STRIPE_QUARANTINE_DESTINATION: ${STRIPE_QUARANTINE_DESTINATION}
        ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
        ALLOWED_ORIGIN_REGEX: ${ALLOWED_ORIGIN_REGEX}
      start: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000
      healthCheck:
        httpGet:
          port: 8000
          path: /health

  - setup: worker
    build:
      base: python@3.11
      buildCommands:
        - cd backend && pip install --no-cache-dir -r requirements.txt
      deployFiles:
        - backend/~
    run:
      base: python@3.11
      envVariables:
        POSTGRES_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        NEO4J_URI: ${NEO4J_URI}
        NEO4J_USER: ${NEO4J_USER}
        NEO4J_PASSWORD: ${NEO4J_PASSWORD}
        GROQ_API_KEY: ${GROQ_API_KEY}
        GROQ_MODEL: ${GROQ_MODEL}
      start: cd backend && python -m app.workers.ingest_worker
